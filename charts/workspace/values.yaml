# Workspace configuration
#
# Each workspace gets its OWN namespace, `ws-<user>` (issue #103) — the same
# string as the Deployment/ServiceAccount. This is what makes tenant isolation
# real: a workspace pod's ServiceAccount can only see Secrets/pods in its own
# namespace, so the predictable-secret-name cross-tenant read that the shared
# `coder` namespace allowed is closed by construction.
#
# The scaffold (scripts/new-user.sh), the controller provisioner, and
# `make deploy` all set this to `ws-<user>` and create+label the namespace
# out-of-band before `helm install`. The default below is only a fallback for
# bare `helm template`/`helm install` invocations.
namespace: coder

# User configuration
user:
  name: ""
  # Home-volume size. 20Gi is a sensible default for a dev workspace; bump
  # per-user in their values.yaml if they need more. Note: PVCs can grow but
  # not shrink, so raising this later is fine — lowering it won't reclaim an
  # already-provisioned volume.
  pvcSize: 20Gi
  host: ""
  env:
    - name: GIT_USER_NAME
      value: ""
    - name: GIT_USER_EMAIL
      value: ""

# Container image configuration
image:
  repository: registry.digitalocean.com/resourceloop/coder
  tag: devlaptop-v1.58.2
  pullPolicy: Always
  pullSecretName: regcred

# Ingress configuration
#   auth.type:
#     "basic"  — http basic auth from .ingress.auth.secretName
#     "oauth2" — oauth2-proxy in front of every /oauth/* path
#     "none"   — bare TLS; anyone can hit it (use only with readOnly: true).
#                CONFIDENTIALITY WARNING: read-only stops WRITES, not READS.
#                In this mode every readable file on the PVC is downloadable by
#                anonymous visitors. server.py refuses hidden (dot) path segments
#                (.claude-tasks/.api-token, .config, .ssh, .git, …) for direct
#                file reads, but you MUST still serve a public demo from a FRESH,
#                sanitized PVC — NEVER reuse a private workspace's PVC. See the
#                `publicDemo` block below for PUBLIC_FILE_ROOT / acknowledgement.
ingress:
  className: nginx
  # Max request body nginx accepts on the authed dashboard ingresses (main
  # and oauth2 /oauth/api). Without this nginx's 1m default rejects
  # /api/files/upload bodies with a 413 before they reach server.py. Keep in
  # sync with MAX_UPLOAD_BYTES in server.py (200 MiB).
  bodySize: "200m"
  # Emit a configuration-snippet on the Bearer-API ingress that strips identity
  # headers at the edge. Only enable on clusters whose ingress-nginx allows
  # snippet annotations — with snippets disabled (this cluster: CVE-2021-25742
  # hardening) the admission webhook rejects the whole Ingress. Off by default;
  # the /bearer-api/ rewrite marker gives the same guarantee server-side.
  identityHeaderStripSnippet: false
  auth:
    type: basic
    secretName: ""
  tls:
    enabled: true
    secretName: ""
    clusterIssuer: letsencrypt-production
  # Caps applied only by ingress-public.yaml (auth.type=none). Defense in
  # depth around the unauthed demo surface — bump these for a higher-
  # traffic demo, but don't disable them.
  publicLimits:
    rps: 10
    connections: 20
    bodySize: "16k"

# "Workspace is restarting…" holding page (issue #184). A tiny always-up nginx
# Deployment (holding-<user>) wired in as the custom-error backend on the root
# dashboard ingress(es), so the ~1 min Recreate downtime of a self-serve update
# shows a branded auto-recovering page instead of a raw nginx 503. Separate
# Deployment (survives the workspace pod's Recreate), no PVC, tens of MiB.
holdingPage:
  enabled: true
  # nginx-unprivileged listens on 8080 as a non-root user, which fits the
  # read-only/non-root securityContext without extra config.
  image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
  # One replica is enough for a transient holding page; bump to 2 if you want it
  # to survive a single-node drain during the restart window.
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

# OAuth2 (GitHub) settings — only used when ingress.auth.type=oauth2.
# Real credentials should come from a gitignored overlay (e.g.
# secrets/<user>/oauth2.yaml). Public-repo defaults leave them empty,
# and oauth2-proxy.yaml renders a `required` guard so a forgotten
# overlay surfaces at `helm install` time rather than as a silently
# broken pod.
oauth2:
  cookieSecret: ""        # 16/24/32 random bytes, base64-encoded
  clientId: ""            # GitHub OAuth App client id
  clientSecret: ""        # GitHub OAuth App client secret
  githubUsers: ""         # comma-separated allowlist (optional)
  githubOrg: ""           # restrict to org members (optional)
  githubTeam: ""          # restrict to team slug (optional)
  # Session lifetime. GitHub OAuth apps issue no refresh token, so oauth2-proxy
  # cannot silently renew a session — it is hard-capped at cookieExpire, after
  # which the user must log in again. Default 30d so returning to the workspace
  # the next day doesn't force a re-login. cookieRefresh is a no-op for GitHub
  # (no token to refresh); keep it 0 to avoid pointless re-validation/log spam.
  cookieExpire: "720h0m0s"  # 30 days
  cookieRefresh: "0"        # disabled — GitHub has no refresh token

# Read-only public demo mode. When true:
#   - server.py rejects every POST/DELETE/PUT with 403 readonly
#   - the dashboard SPA hides New/Edit/Delete/Kill/Rename/Send UI
#   - the workspace pod boots with readOnlyRootFilesystem + tmpfs scratch
#   - the kube-coder source clone is skipped (no writes)
#   - the docker-in-docker sidecar is dropped
# Hard-coupled to ingress.auth.type=none so we never accidentally expose a
# mutable workspace without auth — server.py refuses to start in that combo.
#
# CONFIDENTIALITY (finding 3): read-only protects INTEGRITY, not confidentiality.
# With auth.type=none the request layer is UNAUTHENTICATED, so every readable
# file on this workspace's PVC is effectively public — even though writes 403.
# server.py refuses hidden (dot) path segments for direct file download/preview/
# view (so .claude-tasks/.api-token, .config, .ssh, .git are not leaked), but a
# public demo MUST be served from a NEWLY CREATED, sanitized PVC. NEVER reuse a
# private workspace's PVC for a public demo. See the `publicDemo` block.
readOnly: false

# Public-demo confidentiality controls (only meaningful with auth.type=none +
# readOnly:true — the unauthenticated public demo). Both are optional.
publicDemo:
  # Confine public (unauthenticated) file reads to this subdir of /home/dev,
  # e.g. "demo". Empty (default) => reads are allowed anywhere under /home/dev
  # except hidden (dot) path segments, which are always refused in none-mode.
  fileRoot: ""
  # Set true to acknowledge that readable PVC files are public in this mode and
  # that you are serving from a fresh, sanitized PVC. Silences the loud startup
  # warning server.py prints when public mode is active without acknowledgement.
  acknowledged: false

# Public-demo hint: when true, the read-only SPA shows ALL persistent
# memories on the Memory tab (including auto-imported `claude.*` notes)
# instead of just the curated demo set. The server still enforces
# read-only writes — this only affects what the SPA renders. Off by
# default; only flip on for a demo deployment where the visible memory
# is intended as documentation.
demoShowAll: false

# Self-serve version updates: lets a user update their OWN workspace to the
# latest release from the dashboard's Settings → Updates section. The workspace
# has no kube access, so the action is brokered to the workspace-controller's
# token-gated self-serve listener. Opt-in: create one Secret in the namespace
# with key `self-serve-token`, name it here AND in the controller chart's
# `controller.update.selfServeSecretName`. Empty (default) => the Updates
# section reports "self-serve unavailable" and admins update from the controller
# dashboard instead.
update:
  selfServeSecretName: ""
  # Override the controller self-serve URL. Defaults to the in-cluster Service
  # on its self-serve port, in the controller's own namespace (below):
  # http://workspace-controller.<controllerNamespace>.svc.cluster.local:8081
  controllerUrl: ""
  # Namespace the workspace-controller Service lives in. With per-workspace
  # namespaces the workspace no longer shares a namespace with the controller,
  # so the self-serve URL must target the control-plane namespace explicitly
  # rather than deriving it from this workspace's `.Values.namespace`.
  controllerNamespace: coder

# Resource limits and requests.
#
# Burstable by design: requests are a lean *scheduling floor* sized for a
# mostly-idle dev workspace (typical usage is well under 250m CPU), while
# limits stay generous so builds/tests can still burst to a couple of cores
# and a few GB. Keeping requests low is what lets a node pack ~10 workspaces
# instead of ~3 — scheduling reserves requests, not limits. A workspace that
# genuinely needs a higher baseline should override requests in its own
# values.yaml rather than raising this shared default.
resources:
  requests:
    # CPU request is the SCHEDULER RESERVATION, not a usage cap (that's limits).
    # An idle workspace (code-server + server.py) sits well under 100m and
    # bursts to the 2-core limit on demand regardless of this floor, so a high
    # request just strands node capacity as unschedulable reservation. Kept low
    # (100m) so nodes pack efficiently; a workspace that needs a guaranteed
    # higher baseline overrides this in its own values.yaml. See #95 / the
    # node-pool over-reservation that wedged scheduling at ~96% requested.
    cpu: "100m"
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

# Sandboxed container runtime for the workspace pod (#613). Empty = the cluster
# default runtime, i.e. exactly today's behaviour — the field is omitted from the
# pod spec entirely rather than rendered empty.
#
# Set to the name of a RuntimeClass ("gvisor", "kata-containers", …) to run
# workspaces under a stronger kernel boundary: gVisor intercepts syscalls in a
# user-space kernel, Kata runs the pod in a lightweight VM. This bounds what a
# compromised agent can reach. It does NOT stop prompt injection, and it does not
# separate a workspace's human from its agents — they share one pod and one
# kernel boundary whatever the runtime is.
#
# PREREQUISITE, and the failure mode if you skip it: the cluster must already
# have nodes running that runtime AND a matching RuntimeClass object. Naming one
# that does not exist makes the workspace pod UNSCHEDULABLE — it sits Pending and
# the workspace never starts.
#
# Note for build.mode: buildkit — that mode adds a `privileged: true` DinD
# sidecar, and gVisor does not support privileged containers, so builds will fail
# (at build time, not at schedule time, which makes it confusing to diagnose).
# Kata is VM-backed and does not have this limitation. The default kaniko mode
# has no DinD sidecar and is unaffected. See SECURITY.md.
runtimeClassName: ""

# Per-namespace ResourceQuota + LimitRange (see templates/resourcequota.yaml).
# Now that each workspace owns its namespace, the quota bounds a single tenant
# instead of a shared pool.
#
# The four requests/limits caps below default to "" => AUTO-DERIVED from the
# workspace pod's own resources: the sum across ide + the privileged `dind`
# build sidecar (present when build.mode=buildkit), plus a fixed overhead for
# the oauth2-proxy pair, one in-flight build Job, and the cert-manager ACME
# solver. This keeps the quota correct as a workspace's ide/dind limits change,
# instead of a static ceiling a heavier workspace could exhaust by itself —
# which starved oauth2-proxy + cert-manager and took a workspace's ingress/TLS
# down on migration (#103). Pin any field to override the derived value. These
# are ceilings, not reservations, so a lighter (kaniko / no-dind) workspace only
# requests what it uses. Ties into #95.
quota:
  enabled: true
  requestsCpu: ""      # "" => derive (ide+dind requests + overheadReq*)
  requestsMemory: ""
  limitsCpu: ""        # "" => derive (ide+dind limits + overhead*)
  limitsMemory: ""
  pods: "20"
  # Headroom added on top of the derived pod sum (oauth2-proxy pair + one build
  # Job + ACME solver + margin). Tune if your auxiliary pods differ.
  overheadCpuMilli: 2000
  overheadMemoryMi: 4096
  overheadReqCpuMilli: 500
  overheadReqMemoryMi: 1024
  # LimitRange defaults applied to any container that omits its own
  # requests/limits (e.g. ad-hoc build Jobs), so nothing runs unbounded.
  limitRange:
    enabled: true
    defaultRequestCpu: "100m"
    defaultRequestMemory: 256Mi
    defaultLimitCpu: "1"
    defaultLimitMemory: 1Gi

# Cross-namespace access for the workspace-controller admin console. With
# per-workspace namespaces the controller runs in its own control-plane
# namespace and reaches this workspace via a RoleBinding the chart renders here
# (templates/controller-rbac.yaml), binding the controller's ServiceAccount to
# the cluster-defined `workspace-controller` ClusterRole — scoped to THIS
# namespace only (no cluster-wide scale grant). Disable if you wire controller
# RBAC out-of-band.
controller:
  namespace: coder
  serviceAccount: workspace-controller
  clusterRole: workspace-controller
  rbac:
    enabled: true

# NetworkPolicy — what this workspace's pods may talk to.
#
# Ingress (templates/networkpolicy.yaml) is always rendered and not
# configurable: only the ingress controller may reach the workspace/oauth2-proxy
# pods. Egress (templates/networkpolicy-egress.yaml, #548) is configured here.
#
# WHY EGRESS IS RESTRICTED BY DEFAULT: a workspace pod runs agent-generated code
# by design (npm lifecycle scripts, whatever an agent is told to run, anything a
# prompt-injection reaches a shell with). With no egress policy that code can
# `curl http://169.254.169.254/…` — the cloud metadata endpoint — which on every
# managed Kubernetes provider serves node identity and cloud-init `user-data`.
# On DOKS that payload carries the kubelet bootstrap token and the cluster CA;
# GKE/EKS/AKS expose an equivalent. That is node-join credential material, i.e. a
# cluster-integrity problem, not info disclosure. It can also dial other tenants'
# pods directly. Neither is something a legitimate agent workload ever needs, so
# unlike a domain allowlist (#355) this is safe to ship default-on.
#
# WHAT STAYS OPEN: everything else. The policy allows 0.0.0.0/0 minus the denied
# ranges, so GitHub, npm, PyPI, registries and model providers are unaffected —
# and DNS, the kube-apiserver (Triggers + the task API need it) and the
# controller's self-serve port are punched back through explicitly.
networkPolicy:
  egress:
    enabled: true
    # Which policy object to render:
    #   auto           — CiliumNetworkPolicy if the cluster registers cilium.io/v2,
    #                    otherwise the portable NetworkPolicy. (default)
    #   networkpolicy  — always the portable networking.k8s.io/v1 NetworkPolicy.
    #   cilium         — always the CiliumNetworkPolicy (requires the CRD, and
    #                    Cilium >= 1.9 — that is when deny policies became
    #                    available and enabled by default. An older agent would
    #                    not enforce the egressDeny block this flavor leads with,
    #                    leaving only the weaker `except` behind it.)
    # Note `helm template` has no cluster to interrogate, so `auto` renders the
    # portable form there; `helm install/upgrade` against a Cilium cluster picks
    # the Cilium form. Pin the flavor if you diff rendered manifests in CI.
    #
    # THE FLAVORS ENFORCE DIFFERENTLY — see allowCIDRs below. The portable form
    # is purely additive (deny = absence of an allow); the Cilium form leads
    # with an explicit `egressDeny`, which per Cilium's docs outranks every
    # allow rule in the cluster. That is deliberate: Cilium's identity for a
    # link-local address is not stable across agent restarts (cilium/cilium
    # #18644), so an `except` alone would be a control whose correctness depends
    # on daemon startup order. The deny makes the question moot. Deny rules are
    # L3/L4 only (no L7, no toFQDNs), which plain CIDRs don't need.
    flavor: auto
    # Ranges the workspace pod may NOT reach. THESE ARE CLUSTER-SPECIFIC — the
    # defaults below are link-local plus this project's own DOKS pod/service
    # CIDRs. Check yours before relying on the last two:
    #   pod CIDR:     kubectl cluster-info dump | grep -m1 -- --cluster-cidr
    #   service CIDR: kubectl cluster-info dump | grep -m1 -- --service-cluster-ip-range
    # A range that doesn't exist on your cluster is a harmless no-op (it fails
    # open, not closed) — but you get no cross-tenant protection until these
    # match reality. 169.254.0.0/16 is universal; never remove it.
    deniedCIDRs:
      - "169.254.0.0/16"   # link-local: cloud metadata (169.254.169.254) on every provider
      - "10.244.0.0/16"    # pod CIDR — other tenants' pods
      - "10.245.0.0/16"    # service CIDR — in-cluster services
    # Extra allows, as plain CIDRs — an in-cluster service you actually need, a
    # NodeLocal DNSCache at 169.254.20.10/32, and so on.
    #
    # !! FLAVOR DIFFERENCE, and the one real footgun here !!
    #   portable — additive. An entry here DOES punch back through a denied
    #              range, because the deny is only the absence of an allow.
    #   cilium   — deny wins. An entry inside a denied range is a SILENT NO-OP.
    # To reach an address inside a denied range on either flavor, narrow
    # deniedCIDRs instead of relying on this: e.g. to keep a NodeLocal DNSCache
    # at 169.254.20.10 reachable while still blocking metadata, replace
    # "169.254.0.0/16" with "169.254.128.0/17" (which still covers
    # 169.254.169.254) or with "169.254.169.254/32". Narrowing works identically
    # on both flavors, which is why it's the supported route.
    allowCIDRs: []
    # Dual-stack. An ipBlock/toCIDRSet is single-family, so the v4 allow above
    # cannot carry v6 excepts — IPv6 needs its own ::/0 rule. Without one,
    # policyTypes:Egress default-deny would drop ALL IPv6 egress the moment this
    # policy is enabled: a silent product break, not a safe default. So the v6
    # allow renders by default; on a v4-only cluster it is inert (there is no v6
    # traffic to match). Set false only if your CNI objects to v6 rules.
    allowIPv6: true
    # v6 counterparts of deniedCIDRs. fe80::/10 is the link-local range (the
    # direct analogue of 169.254.0.0/16); fd00:ec2::/32 covers AWS's IMDS-over-
    # IPv6 endpoint (fd00:ec2::254). On a dual-stack cluster add your v6
    # pod/service CIDRs here too — they are usually inside fd00::/8, so denying
    # that whole range instead would take out far more than you intend.
    deniedCIDRsV6:
      - "fe80::/10"
      - "fd00:ec2::/32"
    # DNS. kube-dns' ClusterIP normally sits INSIDE the denied service CIDR, so
    # without this rule the policy would kill name resolution and with it all
    # outbound internet. Allowed two ways because CNIs differ on whether egress
    # policy sees the ClusterIP or the already-translated backend pod IP:
    # by ClusterIP, and by the kube-dns pods' own labels. Both are port 53 only.
    dns:
      enabled: true
      serviceIPs:
        - "10.245.0.10/32"  # `kubectl -n kube-system get svc kube-dns`
      namespace: kube-system
      podLabels:
        k8s-app: kube-dns   # CoreDNS keeps this label on GKE/EKS/AKS/DOKS alike
    # kube-apiserver. In scope to PRESERVE, deliberately: the workspace SA is
    # already RBAC-scoped to its own namespace and legitimately uses the
    # apiserver (Triggers, the Claude task API). Its ClusterIP is the first
    # address of the service CIDR, so it too must be carved back out.
    # Portable flavor only — the Cilium flavor uses the kube-apiserver entity,
    # which also covers clusters whose apiserver lives outside the cluster.
    apiServerIPs:
      - "10.245.0.1/32"     # $KUBERNETES_SERVICE_HOST inside any pod
    # Cilium flavor only. CIDR rules in Cilium do NOT match the host or other
    # nodes (they carry `host`/`remote-node` identity, not a CIDR one), and the
    # apiserver carries `kube-apiserver` — so these must be named as entities or
    # node-local DNS, NodePorts and the apiserver break. The egressDeny block
    # outranks these, so they cannot re-open a denied range. The one exception
    # is an address Cilium maps host-ward, where CIDR matching is skipped
    # entirely (cilium/cilium#18644): drop `host` here if nothing on your
    # cluster is legitimately reachable at a node address.
    entities:
      - kube-apiserver
      - host
      - remote-node

# Build configuration.
#
#   mode: kaniko    (default, recommended)
#     Image builds run as a one-shot Kaniko Job in the user's namespace,
#     scheduled by the `docker-build` wrapper. No daemon, no privileged
#     container. `docker run` and `docker buildx` are NOT available from
#     the user's shell.
#
#   mode: buildkit
#     Adds a `dind` sidecar to every workspace pod running with
#     `privileged: true` + UID 0. This gives `docker buildx` and ad-hoc
#     `docker run` from the user's shell, but a shell in either container
#     can escape to the underlying node. On a shared multi-tenant cluster
#     prefer `kaniko` unless `docker run` is required.
build:
  mode: kaniko
  # Pinned for reproducible builds; Renovate bumps the tag+digest weekly.
  kanikoImage: gcr.io/kaniko-project/executor:v1.24.0
  pushSecretName: regcred
  defaultDestinationRepo: registry.digitalocean.com/resourceloop/coder

# SSH server configuration. When enabled, an `ssh-server` sidecar runs in
# the workspace pod (root, port 22, shares the home PVC). Access via
# `kubectl port-forward` for initial testing; add a Service of type
# LoadBalancer or ingress TCP services for permanent external access.
ssh:
  enabled: false
  port: 22
  # Public keys allowed to log in as the `ubuntu` user. One key per line.
  # Equivalent to ~/.ssh/authorized_keys content. Provide via secrets file
  # for production; inline is fine for testing.
  authorizedKeys: ""

# code-server (VS Code in the browser) is on by default. Set enabled=false
# to skip the launch entirely — useful for workspaces accessed via SSH
# (Zed remote-dev, JetBrains Gateway, VS Code remote-ssh, etc.) where the
# user's local editor connects directly and code-server's ~400MB baseline
# is just wasted memory.
codeServer:
  enabled: true

# In-pod virtual-desktop browser stack (Xvfb + fluxbox + x11vnc + websockify)
# is on by default. It backs the dashboard's "Launch browser" button and the
# Preview pane's *Browser* mode (noVNC), plus any GUI app on DISPLAY=:99.
# Set enabled=false to skip it entirely and reclaim its ~95MB idle baseline
# (measured: Xvfb ~31MB + websockify ~38MB + x11vnc ~15MB + fluxbox ~11MB).
# The Preview pane's default *App* mode renders target apps through a
# reverse-proxy iframe and does NOT depend on this stack — only the explicit
# Browser toggle and GUI apps do. Firefox itself is already on-demand
# (launched via the dashboard, not at boot), so this gates only the always-on
# X/VNC scaffolding.
browser:
  enabled: true

# Claude Code configuration
# Two auth methods are supported:
#   1. OAuth (subscription): Leave apiKey empty, run `claude` in the pod once to login interactively.
#   2. API key (pay-per-use): Set apiKey below or via --set claude.apiKey=sk-ant-...
# If apiKey is set, it takes precedence over OAuth.
claude:
  apiKey: ""
  # Default reasoning effort for Claude in the Hypervisor chat (#362): one of
  # low/medium/high/xhigh/max. Blank => the built-in default (high). Users can
  # still switch per-thread in the chat. `max` clamps to Claude Code's xhigh.
  effort: ""

# Hypervisor — the workspace-aware chat tab. A clean chat interface layered
# over the user's existing CLI agents (claude, ante, opencode, …) plus a
# dashboard MCP server that lets the chat inspect live workspace state and take
# UI-equivalent actions. There is no new provider/model config here: the chat
# uses whichever assistant the user selects, configured via the assistant.*
# blocks below (and the user's own ~/.ante/settings.json etc.).
hypervisor:
  enabled: true
  # Back-compat override for the Hypervisor chat's default assistant only.
  # Empty = inherit the workspace-wide default (assistant.default, issue #395),
  # which is what you normally want. Set it here only to give the Hypervisor a
  # different default than the New Build picker. The user can still switch it
  # per-thread from the tab's selector (any enabled assistant).
  defaultAssistant: ""
  # Working directory for hypervisor chat sessions.
  workdir: "/home/dev"

# AI CTO (#468) — the /cto page: a project registry, a CTO-persona chat, and a
# deterministic project brief. It rides the Hypervisor (no new runner), so it's
# only usable when `hypervisor.enabled` is also true. Set `enabled: false` to
# hide the nav item + CTO route and 404 the projects API without touching chat.
cto:
  enabled: true

# devcontainer.json support (#594) — read the environment file a repo already
# carries (Codespaces / Coder / Ona / DevPod all use it) and apply the parts
# that work inside this pod: forwarded ports land on the Apps page, VS Code
# extensions and settings reach code-server, containerEnv/remoteEnv reach the
# agent. Detection and reporting are read-only and never execute anything.
#
# WHAT IT DELIBERATELY CANNOT DO. `features`, `image`, `build` and
# `dockerComposeFile` are reported with a reason instead of being silently
# ignored: the pod runs as UID 1000 with allowPrivilegeEscalation=false and
# build.mode defaults to kaniko, so there is no root and no Docker daemon.
# That boundary is a documented product decision, not a TODO.
devcontainer:
  enabled: true
  # Re-run postStartCommand once per pod boot. Requires BOTH this flag and a
  # per-workdir opt-in the user set from the dashboard, AND a devcontainer.json
  # whose hash still matches what they consented to. Set false to make command
  # execution require an explicit click, always.
  autoApplyOnBoot: true       # DEVCONTAINER_AUTO_APPLY
  # Wall-clock ceiling for one lifecycle command. The whole process GROUP is
  # killed on expiry, so a runaway `npm install` cannot outlive it.
  commandTimeoutSeconds: 900  # DEVCONTAINER_TIMEOUT

# Conversation Gateway — chat with this workspace's agent over WhatsApp
# (issue #325). OFF by default: with `enabled: false` the /api/gateway/*
# config surface is inert AND templates/ingress-gateway.yaml (the public,
# OAuth-bypassing webhook path) is not rendered at all.
#
# NO CREDENTIALS LIVE HERE. Each user brings their own provider account and
# enters the credentials from the dashboard Settings page at runtime; they are
# stored per-workspace on the PVC (0600) and never appear in the chart, a
# ConfigMap, or an API response. See docs/ and issue #329.
#
# The in-app Walkie-Talkie loopback preview (/api/gateway/internal/*) is a
# separate, always-available surface and is NOT affected by this flag.
gateway:
  enabled: false
  # DEV/SANDBOX ONLY. Accepts inbound webhooks whose provider signature is
  # missing or invalid. Production must leave this false — the chart refuses
  # to render when it is combined with TLS (see templates/deployment.yaml).
  allowUnsigned: false
  # Optional, non-secret: the WhatsApp number shown in the Settings link
  # helper. Purely cosmetic; the real sender comes from the user's credentials.
  whatsappNumber: ""
  limits:
    # Per-workspace throttles on the authenticated config endpoints.
    linkPerHour: 10         # POST /api/gateway/link (pairing codes)
    testPerHour: 20         # POST /api/gateway/test (makes an outbound call)
    # Edge caps on the public webhook ingress, mirroring ingress.publicLimits
    # on the other internet-reachable surface.
    webhookRps: 5
    webhookConnections: 10

# Optional alternate assistants. Claude Code is always available (above);
# OpenCode (https://opencode.ai) becomes a *per-task* choice in the
# dashboard whenever either of the blocks below is configured. Both blocks
# are independent — set one, the other, or both. Real credentials should
# come from a gitignored secrets file (e.g. secrets/<user>/assistant.yaml).
# Public-repo defaults leave both empty, so the dashboard ships with
# Claude-only behavior.
assistant:
  # Workspace-wide default assistant (issue #395) → KC_DEFAULT_ASSISTANT.
  # Governs BOTH the Hypervisor chat and the New Build / task-create picker, so
  # an operator can provision a trial/demo workspace that defaults to a free
  # assistant instead of Claude. Empty = "claude" (vanilla behaviour). Set it to
  # an assistant id that is actually enabled below, e.g. "opencode-zen" together
  # with a Zen key in opencodeZen.apiKey / opencodeZen.sharedSecretName — if the
  # chosen default isn't enabled the server logs a warning and falls back to
  # claude rather than silently mis-defaulting.
  default: ""
  # OpenCode → OpenRouter (https://openrouter.ai)
  openrouter:
    apiKey: ""                            # OPENROUTER_API_KEY (per-user; takes precedence)
    model: "anthropic/claude-sonnet-4"
    # Optional shared OpenRouter secret so EVERY workspace gets OpenRouter
    # without a per-user key: create one Secret (key: openrouter-api-key) in the
    # namespace and name it here. A per-user apiKey above still wins. Empty by
    # default — set per deployment (e.g. in the new-user scaffold).
    sharedSecretName: ""
  # OpenCode → DeepSeek (https://api.deepseek.com)
  # DeepSeek is a first-class OpenCode provider: the CLI auto-discovers
  # the key from $DEEPSEEK_API_KEY, so no on-disk provider stub is needed.
  deepseek:
    apiKey: ""                            # DEEPSEEK_API_KEY
    model: "deepseek-chat"                # or "deepseek-reasoner"
  # DeepSeek Harness (https://github.com/deepseek-ai/deepseek-harness) — the
  # `dsh` CLI, DeepSeek's OWN agent harness, pre-installed in the image. This
  # is a different product from assistant.deepseek above: that one is
  # OpenCode's agent loop with a DeepSeek model answering it; this one is the
  # agent loop DeepSeek's own authors built for their models, driven over the
  # harness's ACP JSON-RPC server. Both coexist; pick per task.
  #
  # There is NO key to set here — it reuses assistant.deepseek.apiKey (the same
  # DEEPSEEK_API_KEY). The dashboard lists it only when that key is set AND the
  # `dsh` binary resolves, so an older image simply doesn't offer it.
  deepseekHarness:
    model: ""                             # KC_DSH_MODEL (blank => deepseek-v4-flash)
    # Optional: comma-separated list that fully REPLACES the built-in model
    # list in the in-chat switcher (e.g. to surface the experimental vision
    # model, which is not offered by default).
    models: ""                            # KC_DSH_MODELS
    # Default reasoning effort (#362). The harness's own stops are
    # off/low/high/max; the canonical level is translated, and `medium` rounds
    # UP to the harness's `high` (its documented balance point) rather than
    # down. Blank => built-in default (high). Nothing clamps: `max` is real.
    effort: ""                            # KC_DSH_EFFORT
  # OpenCode → Zen (https://opencode.ai/zen) — OpenCode's hosted gateway of
  # free coding models (~100 req/day, no credit card, one-time free signup key).
  # This is the zero-cost path for trial/demo workspaces: set assistant.default
  # to "opencode-zen" and provide a key here. Unlike OpenRouter/DeepSeek, Zen is
  # NOT auto-discovered — start.sh writes an explicit opencode.json provider
  # stanza when OPENCODE_API_KEY is set.
  # NOTE: Zen's free models may use submitted data to improve the model — the
  # dashboard surfaces that disclosure; don't send confidential data on them.
  opencodeZen:
    apiKey: ""                            # OPENCODE_API_KEY (per-user; takes precedence)
    model: "deepseek-v4-flash-free"       # KC_OPENCODE_ZEN_MODEL (a Zen free-model id)
    # Optional shared free Zen key so EVERY trial workspace gets Zen without a
    # per-user key: create one Secret (key: opencode-api-key) in the namespace
    # and name it here. A per-user apiKey above still wins. Empty by default.
    sharedSecretName: ""
  # Antigravity (https://antigravity.google) — Google's terminal coding agent
  # (`agy`), pre-installed in the image. Auth is OAuth Google Sign-In, NOT an
  # API key: it appears as a dashboard assistant automatically, and each user
  # runs `agy` once in the pod (prints a URL + one-time code) to log in — the
  # login persists on the PVC. Only an optional model override lives here.
  antigravity:
    model: ""                             # KC_ANTIGRAVITY_MODEL (blank = agy's default)
  # LibreFang (https://librefang.ai) — open-source agent OS. The CLI is
  # pre-installed in the image (like Ante) and reuses whatever provider keys
  # are configured elsewhere (ANTHROPIC_API_KEY, OPENROUTER_API_KEY, …), so
  # there is no key to set here. `agent` picks which LibreFang agent tasks
  # talk to; the registry-bundled "coder" is the right default for a coding
  # workspace.
  librefang:
    agent: "coder"                        # KC_LIBREFANG_AGENT
  # OpenCode → any OpenAI-compatible endpoint
  # (e.g. a private proxy running on your own Digital Ocean droplet)
  fallback:
    baseUrl: ""                           # e.g. https://llm.example.com/v1
    apiKey: ""                            # optional bearer token
    model: "anthropic/claude-sonnet-4"
    providerId: "kube-coder-fallback"     # OpenCode provider id (free-form)
    providerName: "Kube-Coder Fallback"
    # Default reasoning effort for the kc-harness assistant (#362): forwarded as
    # the OpenAI-compatible `reasoning_effort`. Blank => built-in default (high);
    # xhigh/max clamp to high (the harness endpoint's ceiling).
    effort: ""                            # KC_HARNESS_EFFORT
  # Codex (OpenAI) — ChatGPT-OAuth terminal agent, pre-installed. No key here.
  codex:
    # Default reasoning effort (#362): codex model_reasoning_effort. Blank =>
    # built-in default (high); max clamps to codex's xhigh ceiling.
    effort: ""                            # KC_CODEX_EFFORT

# Persistent memory subsystem. SQLite-backed at /home/dev/.claude-memory/memory.db,
# exposed to the dashboard at /api/memory and to claude via the `memory` MCP server.
# Phase 1 ships with these defaults; phases 2-3 activate by flipping flags here.
memory:
  # Embedding provider for semantic recall. Default "none" = FTS5 keyword
  # search only. Set provider + apiKey to activate Phase-2 hybrid vector
  # search (a background worker embeds memories; search fuses FTS + vectors).
  # See docs/persistent-memory.md.
  embeddings:
    provider: "none"        # one of: none | voyage | openai
    model: ""               # blank -> provider default (voyage-3 / text-embedding-3-small)
    dim: ""                 # output dim; blank -> 1024 (matches vec_memories FLOAT[1024])
    # Provider API key. Supply via a gitignored per-user overlay
    # (e.g. secrets/<user>/memory.yaml) — never a public values file. The
    # chart writes it into Secret memory-secrets-<user> and injects it as
    # VOYAGE_API_KEY / OPENAI_API_KEY. Or point existingSecretName at a
    # pre-made Secret with key `embedding-api-key`.
    apiKey: ""
    existingSecretName: ""
    baseUrl: ""             # openai-compatible endpoint (self-hosted / proxy)
  # Auto-injection: prefix new task prompts with the top-K relevant memories.
  # Auto-injection budget. These are the single source of truth: the chart
  # projects them as KC_MEMORY_INJECT_* and the UserPromptSubmit hook reads
  # them (it used to hardcode its own, drifted, copies — #359).
  inject:
    enabled: true
    topK: 8
    minScore: 0.30
    # Whole-block ceiling. Entries are shrunk to fit rather than dropped.
    maxChars: 4096
    # Per-entry ceiling. Long memories are summarized at write time, so this
    # is a backstop — and it now trims on a word boundary, never mid-word.
    maxEntryChars: 280
  # Background consolidation (dedupe + decay). Phase 3 activates this thread.
  consolidation:
    enabled: false
    intervalHours: 6

# Mobile push notifications (Expo). The mobile app registers its device token
# via POST /api/push/register; server.py then pushes the HIGH-SIGNAL feed items
# — an agent waiting on you, or a recorded decision — to the phone. Everything
# else stays in the in-app Feed. Delivery is fire-and-forget to Expo's public
# push service (exp.host); no credential is needed server-side.
push:
  # Projected as KC_PUSH_ENABLED. Set false to keep the feed but send nothing
  # to devices (e.g. the read-only public demo, or a pod you don't want paging
  # a phone). Registered tokens are retained, just not dispatched to.
  enabled: true
  # Optional Expo access token, only needed if the Expo project has
  # enhanced security ("push security") switched on. Projected as
  # EXPO_ACCESS_TOKEN. Supply via a gitignored per-user overlay.
  expoAccessToken: ""

# GitHub App configuration for automatic git/gh authentication.
# Two ways to supply credentials:
#  (1) Inline via appId / installationId / privateKey (the chart creates a
#      Secret named github-app-secrets-<user>). Provide secrets via a
#      values overlay (e.g., secrets/<user>/github-app.yaml). RECOMMENDED.
#  (2) Reference an existing Secret in the same namespace via
#      `existingSecretName`. The Secret must have keys: app-id,
#      installation-id, private-key. Set `appId: "use-existing"` (or any
#      non-empty placeholder) to flip the deployment env-var gate; the
#      actual values come from the referenced Secret.
#
# SECURITY: option (2) lets multiple workspaces share one GitHub App
# private key. Anyone with shell access in a workspace can `cat` that
# key and act as the App on every repo it's installed on. Use only for
# workspaces operated by the same trusted principal — never to give
# another developer a workspace pre-wired to your App.
github:
  app:
    appId: ""
    installationId: ""
    privateKey: ""
    existingSecretName: ""