{{- if and .Values.keeper.enabled (not .Values.keeper.controlSecret.existingSecretName) }}
{{- /*
The shared secret the workspace authenticates its pushes with (#728 step 4):
the trigger ids and the hash of the API token, on the keeper's control listener.

Why a secret and not just the NetworkPolicy that already limits that port to the
workspace pod: a NetworkPolicy does nothing whatsoever unless the cluster's CNI
implements it, and minikube's default silently ignores every one. A port that
can be made to hand out wake authority must not have the CNI as its only lock.

Rendered the same defence-in-depth way as the controller's admin token
(charts/workspace-controller/templates/admin-token-secret.yaml): pin a value
with keeper.controlSecret.value, bring your own Secret with
keeper.controlSecret.existingSecretName, or — the default — generate one here.
The generated value is PRESERVED across `helm upgrade` by looking up the live
Secret, so an upgrade never silently rotates it and leaves the workspace unable
to push until it restarts.

Note for tests: `lookup` returns nothing under `helm template` and
`helm unittest`, which have no cluster to ask, so a render there mints a fresh
value every time. Only the `value` and `existingSecretName` paths are
assertable without a cluster.

To rotate deliberately: delete this Secret and restart both Deployments.
*/}}
{{- $name := printf "keeper-%s-control" .Values.user.name }}
{{- $val := .Values.keeper.controlSecret.value }}
{{- if not $val }}
  {{- $existing := (lookup "v1" "Secret" .Values.namespace $name) }}
  {{- if and $existing $existing.data (index $existing.data "secret") }}
    {{- $val = (index $existing.data "secret" | b64dec) }}
  {{- else }}
    {{- $val = randAlphaNum 48 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: keeper-{{ .Values.user.name }}
type: Opaque
stringData:
  secret: {{ $val | quote }}
{{- end }}
