{{- if eq .Values.ingress.auth.type "oauth2" }}
# Ingress for the workspace API — no OAuth2 proxy, Bearer-token auth instead.
# This is what the mobile app + scripts/curl use without a browser session: the
# task API (/api/claude/*), the memory store (/api/memory*), and the /metrics +
# /health probes. All are served by BrowserHandler on port 6080.
# Auth: /api/claude, /api/memory and /metrics verify the Bearer token
# (check_claude_auth); only /health is unauthenticated (a plain liveness probe).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ws-{{ .Values.user.name }}-claude-api
  namespace: {{ .Values.namespace }}
  labels:
    app: ws-{{ .Values.user.name }}
  annotations:
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
    {{- end }}
    # Route through a /bearer-api/ marker prefix. server.py's
    # _consume_bearer_marker() strips it and flags the request "bearer-only", so
    # it never trusts upstream identity headers (X-Auth-Request-*, Remote-User)
    # on this path — the Bearer token is the only accepted credential. This is
    # the primary, deployment-independent guard against a forged identity header
    # here (rewrite-target is core nginx, unlike snippet annotations below).
    nginx.ingress.kubernetes.io/rewrite-target: /bearer-api/$1
    {{- if .Values.keeper.enabled }}
    # While the workspace pod is away this Service has no endpoints and stock
    # ingress-nginx answers a raw 503 with an HTML body. The app can only
    # recognise "my workspace is asleep" from a JSON body carrying
    # code=workspace_sleeping (#778, mobile/src/util/workspaceReach.ts); an HTML
    # 503 classifies as the vaguer "unreachable" instead. The keeper's page
    # listener answers either, chosen from the caller's Accept, which
    # ingress-nginx passes to an error backend as X-Format.
    nginx.ingress.kubernetes.io/custom-http-errors: "502,503,504"
    nginx.ingress.kubernetes.io/default-backend: keeper-{{ .Values.user.name }}
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    {{- if .Values.ingress.identityHeaderStripSnippet }}
    # Belt-and-suspenders: also strip the identity headers at the edge so they
    # never reach the pod. Requires ingress-nginx `allow-snippet-annotations:
    # "true"` — this cluster runs with snippets DISABLED (CVE-2021-25742
    # hardening, see _helpers.tpl) and its admission webhook REJECTS the whole
    # Ingress if this is set, so it defaults off. The /bearer-api/ marker above
    # enforces the same guarantee server-side regardless.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Auth-Request-User "";
      proxy_set_header X-Auth-Request-Email "";
      proxy_set_header X-Auth-Request-Access-Token "";
      proxy_set_header Remote-User "";
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
  - hosts:
    - {{ .Values.user.host }}
    secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
  - host: {{ .Values.user.host }}
    http:
      paths:
      # The capture group is re-applied by rewrite-target (/$1), so the path
      # reaches BrowserHandler unchanged. The whole API surface routes here
      # deliberately (issue #428): auth is enforced server-side, per endpoint —
      # the /bearer-api/ marker makes check_claude_auth demand the Bearer token
      # and distrust identity headers (#161), so an enumerated whitelist added
      # no security boundary while silently 404ing every API added after #174
      # for the mobile app (hypervisor, files, skills, gateway, …). The only
      # /api endpoint that skips check_claude_auth is the WhatsApp webhook
      # verify, which is provider-signature-gated and already public via its
      # own ingress. /metrics is token-checked; /health is a plain liveness
      # probe and intentionally open.
      {{- if .Values.keeper.enabled }}
      # The negative lookahead hands /api/keeper/status and /api/keeper/wake to
      # keeper-ingress-api.yaml and keeps everything else here (#728 step 4).
      #
      # Making the two location sets disjoint is deliberate. On this host every
      # location is rendered as a regex, because several Ingresses here use
      # rewrite-target, so ingress-nginx widens even `pathType: Exact` into a
      # case-insensitive prefix and the winner is decided by emission order.
      # Step 3's keeper paths happened to be the longer string and won; the
      # app's /api/keeper/wake is SHORTER than this pattern, so relying on the
      # same luck would be a coin toss. With the paths disjoint, order cannot
      # matter.
      #
      # Scoped to exactly those two paths, anchored with $: /api/keeper/idle is
      # step 1's endpoint, served by the workspace, and must still arrive here.
      - path: /(api/(?!keeper/(?:status|wake)$).*|metrics|health)
      {{- else }}
      - path: /(api/.*|metrics|health)
      {{- end }}
        pathType: ImplementationSpecific
        backend:
          service:
            name: ws-{{ .Values.user.name }}
            port:
              number: 6080
{{- end }}
