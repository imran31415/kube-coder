{{- if .Values.keeper.enabled }}
# Only the ingress controller may reach the keeper, on its two ports — the same
# rule networkpolicy.yaml applies to the workspace pod. The keeper holds a
# token that can stop and start the workspace, so no other pod in the cluster
# (including the workspace's own) gets to talk to it directly. Kubelet probes
# are not subject to NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keeper-{{ .Values.user.name }}-ingress
  namespace: {{ .Values.namespace }}
  labels:
    app: keeper-{{ .Values.user.name }}
spec:
  podSelector:
    matchLabels:
      app: keeper-{{ .Values.user.name }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
{{- end }}
