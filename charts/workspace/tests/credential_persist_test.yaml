suite: per-tool credential persistence (#243, #795)
# The interactive terminals run with HOME=/home/ubuntu (ephemeral), so
# without these redirects onto the persistent /home/dev/.credentials store,
# Expo/npm/Docker/AWS/gcloud logins are wiped on every pod restart.
#
# And $HOME is not /home/ubuntu everywhere (#795): server.py forces
# HOME=/home/dev on the CLIs it spawns, so persist_cred has to link BOTH
# homes at the one store, or an agent shell reads a separate unmanaged set of
# credentials — which is how /home/dev/.gitconfig came to carry the #454
# helper-chain reset that broke `git push` for every agent task.
# Behavioural coverage (migration, idempotency, the link-shaped edge cases)
# executes the real function in tests/credential_home_mirror_test.py; these
# assertions only prove the wiring ships in the configmap.
templates:
  - templates/workspace-entrypoint-configmap.yaml
  - templates/ssh-server-configmap.yaml
values:
  - test-values.yaml
tests:
  - it: redirects each per-tool credential path onto the PVC in start.sh
    template: templates/workspace-entrypoint-configmap.yaml
    asserts:
      - matchRegex:
          path: data["start.sh"]
          pattern: "persist_cred .expo\\s+dir"
      - matchRegex:
          path: data["start.sh"]
          pattern: "persist_cred .docker\\s+dir"
      - matchRegex:
          path: data["start.sh"]
          pattern: "persist_cred .aws\\s+dir"
      - matchRegex:
          path: data["start.sh"]
          pattern: "persist_cred .config/gcloud\\s+dir"
      - matchRegex:
          path: data["start.sh"]
          pattern: "persist_cred .npmrc\\s+file"
      - matchRegex:
          path: data["start.sh"]
          pattern: "persist_cred .git-credentials file"
      - matchRegex:
          path: data["start.sh"]
          pattern: "persist_cred .config/.wrangler dir"

  - it: migrates an existing login once, no-clobber, before symlinking
    template: templates/workspace-entrypoint-configmap.yaml
    asserts:
      # cp -an = archive + no-clobber, so a real PVC login is never
      # overwritten by a stale ephemeral copy on restart.
      - matchRegex:
          path: data["start.sh"]
          pattern: 'cp -an "\$link/\." "\$target/"'
      - matchRegex:
          path: data["start.sh"]
          pattern: 'ln -sfn "\$target" "\$link"'

  - it: links both homes at one store, and migrates PVC data without deleting
    template: templates/workspace-entrypoint-configmap.yaml
    asserts:
      # #795: /home/ubuntu for terminals and sshd, /home/dev for the CLIs
      # server.py spawns. One store, both homes.
      - matchRegex:
          path: data["start.sh"]
          pattern: 'for HOME_DIR in /home/ubuntu /home/dev; do'
      # SSH keys and the git global config join the loop — the latter with an
      # explicit store subpath, so `git config --global` from either home
      # lands on the file every #454 self-heal already writes.
      - matchRegex:
          path: data["start.sh"]
          pattern: 'persist_cred \.ssh\s+dir'
      - matchRegex:
          path: data["start.sh"]
          pattern: 'persist_cred \.gitconfig\s+file \.config/git/config'
      # The loop now runs over the persistent volume, so displaced data is
      # renamed aside (reversible, logged) and never recursively deleted.
      - matchRegex:
          path: data["start.sh"]
          pattern: 'mv -T "\$link" "\$aside"'
      - notMatchRegex:
          path: data["start.sh"]
          pattern: 'rm -rf "\$link"'
      - notMatchRegex:
          path: data["start.sh"]
          pattern: 'rm -f "\$link"'
      # the bespoke ~-based links for .ssh/.gitconfig are gone: `~` resolves
      # to a different home per context, and `ln -sf` through an existing
      # link writes inside the credential store instead of replacing it.
      - notMatchRegex:
          path: data["start.sh"]
          pattern: 'ln -sf /home/dev/\.credentials/\.ssh ~/\.ssh'
      - notMatchRegex:
          path: data["start.sh"]
          pattern: 'ln -sf /home/dev/\.credentials/\.config/git/config ~/\.gitconfig'

  - it: mirrors the same layout into the SSH sidecar when ssh is enabled
    template: templates/ssh-server-configmap.yaml
    set:
      ssh.enabled: true
    asserts:
      - matchRegex:
          path: data["entrypoint.sh"]
          pattern: "ln -sfn /home/dev/.credentials/.expo\\s+/home/ubuntu/.expo"
      - matchRegex:
          path: data["entrypoint.sh"]
          pattern: "ln -sf  /home/dev/.credentials/.npmrc\\s+/home/ubuntu/.npmrc"
      - matchRegex:
          path: data["entrypoint.sh"]
          pattern: "ln -sf  /home/dev/.credentials/.git-credentials /home/ubuntu/.git-credentials"
      - matchRegex:
          path: data["entrypoint.sh"]
          pattern: "ln -sfn /home/dev/.credentials/.config/.wrangler /home/ubuntu/.config/.wrangler"

  - it: links the gh config dir onto the PVC without nesting (#797)
    template: templates/workspace-entrypoint-configmap.yaml
    asserts:
      # `mkdir -p ~/.config/gh` is what made the next `ln -sf` nest: ln
      # treats an existing directory as a destination and writes the link
      # inside it, so ~/.config/gh stayed a real ephemeral dir and
      # `gh auth login` died on every restart.
      - notMatchRegex:
          path: data["start.sh"]
          pattern: "mkdir -p ~/\\.config ~/\\.config/git ~/\\.config/gh"
      - matchRegex:
          path: data["start.sh"]
          pattern: "mkdir -p ~/\\.config ~/\\.config/git\n"
      - matchRegex:
          path: data["start.sh"]
          pattern: "link_cred_dir ~/\\.config/gh /home/dev/\\.credentials/\\.config/gh"
      # The salvage is non-destructive: copy no-clobber, then park the
      # original beside itself — never rm -rf a dir that may hold a login.
      - matchRegex:
          path: data["start.sh"]
          pattern: 'parked="\$link\.pre-797\.\$\(date \+%s\)"'
      - matchRegex:
          path: data["start.sh"]
          pattern: 'ln -sfn "\$target" "\$link"'

  - it: keeps the SSH sidecar's gh link non-dereferencing too (#797)
    template: templates/ssh-server-configmap.yaml
    set:
      ssh.enabled: true
    asserts:
      - matchRegex:
          path: data["entrypoint.sh"]
          pattern: "ln -sfn /home/dev/.credentials/.config/gh\\s+/home/ubuntu/.config/gh"
      # The sidecar must not pre-create the link path either.
      - notMatchRegex:
          path: data["entrypoint.sh"]
          pattern: "mkdir -p /home/ubuntu/\\.config/gh"
