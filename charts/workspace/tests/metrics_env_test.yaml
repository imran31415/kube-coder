suite: workspace metrics scrape token env (#581)
templates:
  - templates/deployment.yaml
  - templates/claude-configmap.yaml
  - templates/terminal-entry-configmap.yaml
  - templates/workspace-entrypoint-configmap.yaml
  - templates/assistant-secret.yaml
  - templates/ssh-server-configmap.yaml
values:
  - test-values.yaml
tests:
  - it: does not mount a scrape token unless one is configured
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_METRICS_SCRAPE_TOKEN
          any: true

  # The value is the per-workspace HMAC derivation seeded by
  # ensure-workspace-namespace.sh — never the Claude Task API token, which is
  # read/write over the whole API and lives on the PVC, not in a Secret.
  - it: mounts the per-workspace scrape token from its own namespace Secret
    template: templates/deployment.yaml
    set:
      metrics.scrapeSecretName: kc-metrics-scrape
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_METRICS_SCRAPE_TOKEN
            valueFrom:
              secretKeyRef:
                name: kc-metrics-scrape
                key: metrics-scrape-token
          any: true

  # #869: the scrape token is only accepted by the metrics-only listener, which
  # this starts. Without the Secret there is no listener and no port.
  - it: starts no metrics listener and exposes no metrics port by default
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_METRICS_PORT
          any: true
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
          any: true

  - it: starts the metrics-only listener on its own named port
    template: templates/deployment.yaml
    set:
      metrics.scrapeSecretName: kc-metrics-scrape
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_METRICS_PORT
            value: "6082"
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 6082
      # 6080 stays the dashboard/API port, and is not renamed or reused.
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: browser
            containerPort: 6080

  - it: refuses to put the metrics listener on a port the workspace already serves
    template: templates/deployment.yaml
    set:
      metrics.scrapeSecretName: kc-metrics-scrape
      metrics.port: 6080
    asserts:
      - failedTemplate:
          errorMessage: metrics.port must be a dedicated port, not one of the workspace's own (6080, 6081, 7681, 8080)
