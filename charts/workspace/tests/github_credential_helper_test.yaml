suite: github.com credential helper survives token rotation (#454)
# `gh auth setup-git` (run by `gh auth login`, or by a stint in personal mode)
# writes a host-scoped section whose EMPTY `helper =` value resets git's helper
# chain, discarding the self-refreshing App-token reader for github.com — the
# one host it exists for. What answers instead is `gh` (which prefers the
# stale GH_TOKEN frozen into long-lived shells) or a stale line in the
# PERSISTENT ~/.git-credentials. Both 401 one rotation after a shell starts.
# The refresh daemon must therefore own the github.com-scoped chain outright.
templates:
  - templates/github-app-token-refresh.yaml
values:
  - test-values.yaml
set:
  github.app.appId: "123"
tests:
  - it: app mode makes the fresh-token reader the effective github.com helper
    asserts:
      - matchRegex:
          path: data["github-app-token.py"]
          pattern: 'HOST_HELPER_KEY = "credential\.https://github\.com\.helper"'
      # 1. replace-all with "" collapses whatever is there (a stale gh entry)
      #    into a single empty reset…
      - matchRegex:
          path: data["github-app-token.py"]
          pattern: '"--replace-all", HOST_HELPER_KEY, ""'
      # 2. …then the file reader is appended, so it is the FIRST — and only —
      #    helper git consults for github.com.
      - matchRegex:
          path: data["github-app-token.py"]
          pattern: '"--add", HOST_HELPER_KEY, helper'
      # the reader still cats the file the daemon rewrites, never a baked token
      - matchRegex:
          path: data["github-app-token.py"]
          pattern: 'password=\$\(cat /home/dev/\.credentials/\.github-token\)'

  - it: app mode purges stale github.com lines from the persistent store file
    asserts:
      - matchRegex:
          path: data["github-app-token.py"]
          pattern: 'GIT_STORE_FILE = os\.path\.join\(CREDENTIALS_DIR, "\.git-credentials"\)'
      - matchRegex:
          path: data["github-app-token.py"]
          pattern: 'def purge_stored_github_credentials'
      # …and actually calls it (configure_git runs on every refresh, not just
      # at boot, so a line stored mid-session is cleaned up within 50 minutes)
      - matchRegex:
          path: data["github-app-token.py"]
          pattern: '\n    purge_stored_github_credentials\(\)'
      # non-GitHub hosts (the documented `store` use case) are preserved
      - matchRegex:
          path: data["github-app-token.py"]
          pattern: 'kept = \[ln for ln in lines if "github\.com" not in ln\]'

  - it: personal mode withdraws only the App-owned github.com helper
    asserts:
      # value-pattern arg, so this can never remove a third-party entry
      - matchRegex:
          path: data["github-app-token.py"]
          pattern: 'HOST_HELPER_KEY, "github-token"'
      # gh still takes over github.com for a personal login (#256)
      - matchRegex:
          path: data["github-app-token.py"]
          pattern: '"auth", "setup-git", "--hostname", "github.com"'
      # the personal branch still returns before the app-mode wiring, so a
      # personal PAT stored for github.com (the user's own, long-lived
      # credential) is never purged and no App helper is installed
      - matchRegex:
          path: data["github-app-token.py"]
          pattern: '"setup-git", "--hostname", "github.com"\],\n\s+capture_output=True,\n\s+\)\n\s+return'
