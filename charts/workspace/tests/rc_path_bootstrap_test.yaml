suite: ephemeral-home rc bootstrap (#334, #793)
# Interactive shells run with HOME=/home/ubuntu, which is rebuilt from skel
# on every pod restart. Without re-seeding its rc files at boot, nothing puts
# the persistent /home/dev/.local/bin on PATH.
#
# But $HOME is NOT /home/ubuntu everywhere (#793): server.py forces
# HOME=/home/dev on the CLIs it spawns, and tmux hands its server's env to
# every later session — so a login shell may read /home/dev/.profile instead.
# bootstrap_rc therefore has to seed BOTH homes, or half the shells in the pod
# silently get no PATH entry, no $BROWSER and no KC_AGENT_DISPLAY.
templates:
  - templates/workspace-entrypoint-configmap.yaml
  - templates/ssh-server-configmap.yaml
values:
  - test-values.yaml
tests:
  - it: seeds both rc files in both homes via bootstrap_rc in start.sh
    template: templates/workspace-entrypoint-configmap.yaml
    asserts:
      - matchRegex:
          path: data["start.sh"]
          pattern: 'bootstrap_rc\(\)'
      # #793: both homes, not just the ephemeral one — an agent task's
      # `bash -l` can run with HOME=/home/dev and read /home/dev/.profile.
      - matchRegex:
          path: data["start.sh"]
          pattern: 'for HOME_DIR in /home/ubuntu /home/dev; do'
      - matchRegex:
          path: data["start.sh"]
          pattern: 'for rc in "\$HOME_DIR/\.profile" "\$HOME_DIR/\.bashrc"'
      # idempotency: a marker grep guards the append, so repeated boots
      # don't stack duplicate blocks. Load-bearing for /home/dev, whose rc
      # files live on the PVC and are never rebuilt from skel.
      - matchRegex:
          path: data["start.sh"]
          pattern: 'grep -qF "\$marker" "\$rc"'
      # the block bodies must not reference $HOME/~, which resolves
      # differently per home — that inversion caused a destructive rm -rf.
      - notMatchRegex:
          path: data["start.sh"]
          pattern: 'export PATH="\$HOME/\.local/bin'

  - it: puts /home/dev/.local/bin on PATH without duplicating the entry
    template: templates/workspace-entrypoint-configmap.yaml
    asserts:
      - matchRegex:
          path: data["start.sh"]
          pattern: 'mkdir -p /home/dev/\.local/bin'
      - matchRegex:
          path: data["start.sh"]
          pattern: '\[ -d /home/dev/\.local/bin \] && case ":\$PATH:" in'
      - matchRegex:
          path: data["start.sh"]
          pattern: 'export PATH="/home/dev/\.local/bin:\$PATH"'

  - it: routes the GitHub App env hook through bootstrap_rc, not /home/dev rc files
    template: templates/workspace-entrypoint-configmap.yaml
    asserts:
      - matchRegex:
          path: data["start.sh"]
          pattern: "bootstrap_rc '/home/dev/\\.profile\\.d-github-env'"
      # the old dead-file writes must not come back
      - notMatchRegex:
          path: data["start.sh"]
          pattern: 'for rc in /home/dev/\.bashrc /home/dev/\.profile'

  - it: mirrors the PATH bootstrap into the SSH sidecar when ssh is enabled
    template: templates/ssh-server-configmap.yaml
    set:
      ssh.enabled: true
    asserts:
      - matchRegex:
          path: data["entrypoint.sh"]
          pattern: 'for rc in /home/ubuntu/\.profile /home/ubuntu/\.bashrc'
      - matchRegex:
          path: data["entrypoint.sh"]
          pattern: 'export PATH="/home/dev/\.local/bin:\$PATH"'

  # Issue #763: no xdg-open/BROWSER in the pod, so `gh auth login --web` printed
  # "Failed opening a web browser". start.sh installs kc-open-url and points an
  # UNSET $BROWSER at it (code-server's own helper must keep winning).
  - it: installs kc-open-url and exports it as $BROWSER only when unset
    template: templates/workspace-entrypoint-configmap.yaml
    asserts:
      - matchRegex:
          path: data["start.sh"]
          pattern: 'cat > /home/dev/\.local/bin/kc-open-url <<''OPENURL'''
      - matchRegex:
          path: data["start.sh"]
          pattern: 'chmod 0755 /home/dev/\.local/bin/kc-open-url'
      - matchRegex:
          path: data["start.sh"]
          pattern: 'bootstrap_rc ''kc-open-url'''
      - matchRegex:
          path: data["start.sh"]
          pattern: 'if \[ -z "\$\{BROWSER:-\}" \] && \[ -x /home/dev/\.local/bin/kc-open-url \]; then'
      - matchRegex:
          path: data["start.sh"]
          pattern: 'export BROWSER=/home/dev/\.local/bin/kc-open-url'

  - it: mirrors the $BROWSER hook into the SSH sidecar when ssh is enabled
    template: templates/ssh-server-configmap.yaml
    set:
      ssh.enabled: true
    asserts:
      - matchRegex:
          path: data["entrypoint.sh"]
          pattern: 'grep -qF ''kc-open-url'' "\$rc"'
      - matchRegex:
          path: data["entrypoint.sh"]
          pattern: 'export BROWSER=/home/dev/\.local/bin/kc-open-url'
