suite: workspace ingress NetworkPolicy — Prometheus scrape carve-out (#581)
templates:
  - templates/networkpolicy.yaml
set:
  user.name: alice
  namespace: ws-alice
tests:
  # Without this the PodMonitor scrapes nothing and reports no error: the base
  # policy denies all ingress except from ingress-nginx, on every port.
  - it: leaves the deny-all-but-ingress-nginx policy alone by default
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 2
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: ingress-nginx

  - it: admits the Prometheus pod on the metrics port only, when scraping is enabled
    set:
      metrics.podMonitor.enabled: true
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 3
      # The original rule is untouched and still carries no port restriction.
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: ingress-nginx
      - notExists:
          path: spec.ingress[0].ports
      - lengthEqual:
          path: spec.ingress[2].ports
          count: 1
      - equal:
          path: spec.ingress[2].ports[0].port
          value: 6082
      - equal:
          path: spec.ingress[2].ports[0].protocol
          value: TCP

  # #869 review: 6080 is the dashboard + Task API, and in oauth2 mode it trusts
  # identity headers from whoever reaches it. The monitoring selector must
  # never be admitted there, whatever port the metrics listener uses.
  - it: never admits the monitoring selector to the dashboard/API port 6080
    set:
      metrics.podMonitor.enabled: true
      metrics.prometheusNamespace: monitoring
    asserts:
      - notContains:
          path: spec.ingress[2].ports
          content:
            protocol: TCP
            port: 6080
      - notExists:
          path: spec.ingress[2].ports[1]
      # The only other rules that name 6080 are this workspace's own cron and
      # keeper pods, by same-namespace podSelector — no namespaceSelector, so
      # nothing in the monitoring namespace can match them.
      - notExists:
          path: spec.ingress[1].from[0].namespaceSelector
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels.app
          value: kube-coder-cron

  - it: follows a custom metrics port and still leaves 6080 closed to it
    set:
      metrics.podMonitor.enabled: true
      metrics.port: 9464
    asserts:
      - equal:
          path: spec.ingress[2].ports[0].port
          value: 9464
      - notContains:
          path: spec.ingress[2].ports
          content:
            protocol: TCP
            port: 6080

  # namespaceSelector AND podSelector in the SAME peer, not two peers: the
  # carve-out is one pod in one namespace, not every pod in `default`.
  - it: scopes the peer to the Prometheus pod rather than its whole namespace
    set:
      metrics.podMonitor.enabled: true
    asserts:
      - lengthEqual:
          path: spec.ingress[2].from
          count: 1
      - equal:
          path: spec.ingress[2].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: default
      - equal:
          path: spec.ingress[2].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: prometheus

  - it: follows a Prometheus installed somewhere other than default
    set:
      metrics.podMonitor.enabled: true
      metrics.prometheusNamespace: monitoring
      metrics.prometheusPodLabels:
        app.kubernetes.io/name: prometheus
        prometheus: kps
    asserts:
      - equal:
          path: spec.ingress[2].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: monitoring
      - equal:
          path: spec.ingress[2].from[0].podSelector.matchLabels.prometheus
          value: kps
