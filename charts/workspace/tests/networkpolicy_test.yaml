suite: networkpolicy tests
templates:
  - templates/networkpolicy.yaml
values:
  - test-values.yaml
tests:
  - it: should name the policy after the user
    asserts:
      - equal:
          path: metadata.name
          value: ws-testuser-ingress

  - it: should still admit the ingress controller namespace
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: ingress-nginx

  - it: should admit this workspace's own cron trigger pods
    asserts:
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels.app
          value: kube-coder-cron
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels["workspace-user"]
          value: testuser

  - it: should confine the cron exception to the API port
    asserts:
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 6080
      - equal:
          path: spec.ingress[1].ports[0].protocol
          value: TCP

  - it: should not let the cron rule cross namespaces
    # A bare podSelector is same-namespace by definition; assert no
    # namespaceSelector ever gets added alongside it.
    asserts:
      - notExists:
          path: spec.ingress[1].from[0].namespaceSelector

  # ── The keeper's forwards (#728 step 4b) ──────────────────────────────────
  # The keeper stands in front of the webhook and cron receivers, so every
  # request it passes on arrives from its own pod. Without this rule each one
  # dies on a connect timeout, and worse than a cron's silent failure: the
  # keeper has already answered the sender 202.
  - it: should admit the keeper to the API port when the keeper is on
    set:
      keeper.enabled: true
      keeper.image: ghcr.io/imran31415/kube-coder/keeper:test
    asserts:
      - equal:
          path: spec.ingress[2].from[0].podSelector.matchLabels.app
          value: keeper-testuser
      - equal:
          path: spec.ingress[2].ports[0].port
          value: 6080
      - equal:
          path: spec.ingress[2].ports[0].protocol
          value: TCP
      # Same-namespace by construction, like the cron rule above: a
      # namespaceSelector would admit a co-tenant's keeper.
      - notExists:
          path: spec.ingress[2].from[0].namespaceSelector

  - it: should add no keeper rule when the keeper is off
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 2
