{{- if .Values.provision.enabled }}
# The privileged half of provisioning — and since #421 it lives in its OWN
# namespace ({{ .Values.provision.broker.namespace }}), not the controller's.
#
# A dedicated ServiceAccount the short-lived provisioner Job runs as; it holds
# every create/update the `workspace` chart needs to `helm upgrade --install` a
# new workspace. The always-on, internet-facing controller never gets these
# verbs — and, as of #421, cannot get them indirectly either.
#
# BLAST RADIUS — what changed, stated honestly. The July 2026 review's finding 4
# was not "this SA is too powerful"; it is powerful because standing up a tenant
# genuinely requires it. The finding was that the SA lived in the SAME namespace
# the internet-facing controller could `create jobs` in, and Kubernetes hands a
# pod a token for whatever SA its manifest names. So "the controller can start
# Jobs" silently meant "the controller can become this identity". #416's
# ValidatingAdmissionPolicy pinned the shape of such a Job and #420 pinned the
# code it ran, but the bridge itself stayed.
#
# It is removed structurally now:
#   * this SA exists only in the broker's namespace;
#   * the controller holds NO binding in that namespace — its one grant there is
#     `create` on ProvisionRequests, a resource with a single string field
#     (templates/broker-rbac.yaml);
#   * the Job is stamped by the broker (broker.py) from a template the request
#     cannot see or shape, and admission still pins that template's shape;
#   * the program the Job runs is the signed image's baked entrypoint (#422),
#     not anything carried in the manifest.
# What a controller compromise buys is a workspace slug. That is the whole
# surface. Provisioning also remains opt-in and off by default.
#
# Cluster-scoped under per-workspace namespaces (#103): standing up a new
# tenant means CREATING its `ws-<user>` Namespace and stamping the workspace
# objects (Deployment, Secrets, quota, RBAC, the regcred image-pull Secret)
# into it. Namespace creation is inherently cluster-scoped, and RBAC cannot
# scope `create` to a namespace that does not exist yet — so this identity is a
# ClusterRole/ClusterRoleBinding. Per-tenant scoped provisioners remain an open
# question on #421; they would need the namespace to pre-exist.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.provision.serviceAccount }}
  namespace: {{ .Values.provision.broker.namespace }}
  labels:
    {{- include "wc.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.provision.serviceAccount }}
  labels:
    {{- include "wc.labels" . | nindent 4 }}
rules:
# Create + label the per-workspace Namespace itself. Deliberately NO `delete`
# (security review July 2026, finding 4): normal provisioning only creates and
# labels the namespace (`make deploy` → ensure-workspace-namespace.sh + helm
# upgrade), never deletes it. Namespace teardown is a separate manual
# decommission runbook (`make undeploy` / migrate-user-namespace.sh) an operator
# runs with their own admin kubeconfig — it is not on the provisioner Job's
# path, so this SA does not need (and must not carry) cluster-wide namespace
# deletion.
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
# The workspace Deployment + its oauth2-proxy Deployment, plus scale subresource
# (helm's --wait reads rollout status).
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Service, PVC, ConfigMaps, the per-user Secrets the chart renders (incl. the
# regcred image-pull Secret copied into each new namespace), and the Helm
# release-state Secret (Helm 3 stores releases as Secrets in the namespace).
- apiGroups: [""]
  resources: ["services", "persistentvolumeclaims", "configmaps", "secrets", "serviceaccounts"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Per-namespace ResourceQuota + LimitRange the workspace chart renders (#103/#95).
- apiGroups: [""]
  resources: ["resourcequotas", "limitranges"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Ingresses for the workspace host + oauth2 routes, plus the per-workspace
# NetworkPolicy the chart always renders (denies cross-tenant ingress to the pods).
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# The per-workspace CiliumNetworkPolicy the chart renders (egress-deny hardening
# #548/#550 — denies workspace egress to link-local + in-cluster CIDRs). It is a
# cilium.io CRD, DISTINCT from the networking.k8s.io NetworkPolicy above, so
# without its own rule `helm upgrade` of a new workspace fails with
# `cannot get resource "ciliumnetworkpolicies" in API group "cilium.io"`.
- apiGroups: ["cilium.io"]
  resources: ["ciliumnetworkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# The oauth2-proxy PodDisruptionBudget the chart ships for its HA proxy pair.
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# The workspace chart ships its own per-user build Role/RoleBinding AND the
# controller RoleBinding (controller-rbac.yaml); Helm must be able to create
# them. (RBAC create is itself privileged — it lives only here.)
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Kubernetes privilege-escalation prevention: to *create* the per-user build Role
# (which grants batch jobs/cronjobs for Triggers), the provisioner must itself
# hold a superset of those verbs. Its other rules already cover the build Role's
# secrets + pods grants; batch is the only addition needed.
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Read pods so `helm --wait` and any troubleshooting can observe rollout.
- apiGroups: [""]
  resources: ["pods", "pods/log", "events"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.provision.serviceAccount }}
  labels:
    {{- include "wc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.provision.serviceAccount }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.provision.serviceAccount }}
  namespace: {{ .Values.provision.broker.namespace }}
{{- end }}
