{{- if .Values.controller.metrics.podMonitor.enabled }}
{{- if not .Values.controller.metrics.enabled }}
{{- fail "controller.metrics.enabled is required for the controller PodMonitor" }}
{{- end }}
{{- if not (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PodMonitor") }}
{{- fail "Install Prometheus Operator PodMonitor CRDs before enabling the controller PodMonitor" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: workspace-controller
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "wc.labels" . | nindent 4 }}
    {{- with .Values.controller.metrics.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: workspace-controller
  podMetricsEndpoints:
  - port: metrics
    path: /metrics
    interval: {{ .Values.controller.metrics.podMonitor.interval }}
    scrapeTimeout: {{ .Values.controller.metrics.podMonitor.scrapeTimeout }}
    relabelings:
    - targetLabel: kube_coder_component
      replacement: controller
{{- end }}
