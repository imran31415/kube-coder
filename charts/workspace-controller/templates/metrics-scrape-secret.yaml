{{- if and .Values.controller.metricsScrapeToken.enabled (not .Values.controller.metricsScrapeToken.existingSecretName) }}
{{- /*
The MASTER metrics scrape token (#581). Never mounted into a workspace: each
workspace namespace is seeded with only the per-workspace derivation
HMAC-SHA256(master, "kc-metrics-scrape/<user>") by
scripts/ensure-workspace-namespace.sh, so a token read out of one workspace —
where the user has root — scrapes that workspace alone. Same shape, and the
same reasoning, as the kc-self-serve master (security review July 2026,
finding 2).

This exists so a Prometheus scrape is never handed a workspace's Claude Task
API token: that one is read/write over the whole API, is self-minted onto the
PVC rather than into a Secret (so no PodMonitor could reference it), and the
user can regenerate it out from under the scraper at any time.

Rendered the same defense-in-depth way as the admin token: pin a value, bring
your own Secret, or (default) auto-generate here. The generated value is
PRESERVED across `helm upgrade` via a lookup of the live Secret — rotating it
silently would break every workspace's scrape until each namespace is re-seeded.
To rotate deliberately: delete this Secret (or set a new `value`), then re-run
`scripts/ensure-workspace-namespace.sh` for every workspace.
*/}}
{{- $name := "kc-metrics-scrape" }}
{{- $val := .Values.controller.metricsScrapeToken.value }}
{{- if not $val }}
  {{- $existing := (lookup "v1" "Secret" .Values.namespace $name) }}
  {{- if and $existing $existing.data (index $existing.data "metrics-scrape-token") }}
    {{- $val = (index $existing.data "metrics-scrape-token" | b64dec) }}
  {{- else }}
    {{- $val = randAlphaNum 48 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "wc.labels" . | nindent 4 }}
type: Opaque
stringData:
  metrics-scrape-token: {{ $val | quote }}
{{- end }}
