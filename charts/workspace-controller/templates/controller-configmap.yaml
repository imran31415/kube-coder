apiVersion: v1
kind: ConfigMap
metadata:
  name: workspace-controller-app
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "wc.labels" . | nindent 4 }}
data:
  controller.py: |
{{ .Files.Get "controller.py" | indent 4 }}

{{- range $name := list "prometheus_exposition.py" "observability_metrics.py" "observability_http.py" "observability_logging.py" }}
  {{ $name }}: |
{{ $.Files.Get $name | indent 4 }}
{{- end }}
