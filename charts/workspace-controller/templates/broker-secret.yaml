{{- if and .Values.provision.enabled (not .Values.provision.existingSecretName) }}
# The GitOps push token, rendered a SECOND time into the broker's namespace.
#
# Two namespaces genuinely need it and neither can read the other's Secrets:
#   * the controller (provisioner-secret.yaml, its own namespace) pushes the
#     generated per-user values to the users-private repo and reads the GitHub
#     API to validate a username;
#   * the broker (here) injects it into the privileged Job's env so the Job can
#     clone that repo.
# Set provision.existingSecretName to manage both yourself (sealed-secrets/SOPS);
# in that case the Secret of that name must exist in BOTH namespaces.
apiVersion: v1
kind: Secret
metadata:
  name: workspace-controller-provision
  namespace: {{ .Values.provision.broker.namespace }}
  labels:
    {{- include "wc.labels" . | nindent 4 }}
type: Opaque
stringData:
  git-token: {{ required "provision.gitToken is required when provision.enabled (set it in users-private/_controller/secrets/provision.yaml)" .Values.provision.gitToken | quote }}
{{- end }}
