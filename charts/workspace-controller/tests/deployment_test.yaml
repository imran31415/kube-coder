suite: workspace-controller deployment
templates:
  - templates/deployment.yaml
  - templates/controller-configmap.yaml
  - templates/controller-web-configmap.yaml
values:
  - test-values.yaml
tests:
  - it: should name the deployment workspace-controller
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: workspace-controller
      - equal:
          path: metadata.namespace
          value: test

  - it: should run two replicas for HA
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: should spread replicas across nodes
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels.app
          value: workspace-controller

  - it: should bind to the SA so kubectl has cluster credentials
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: workspace-controller

  - it: should set the controller image from values
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "test-registry/coder:test"

  - it: should enforce runAsNonRoot at pod level
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: should harden the controller container
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: should trust proxy headers and configure the admin allowlist
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRUSTED_PROXY
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_USERS
            value: "alice,bob"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WORKSPACE_PREFIX
            value: "ws-"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROMETHEUS_URL
            value: "http://prom.test.local:9090"

  - it: should expose HTTP on port 8080
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /livez

  - it: should always set RELEASE_REPO for the update check
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RELEASE_REPO
            value: imran31415/kube-coder

  - it: should NOT expose the self-serve port or token by default
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: self-serve
            containerPort: 8081
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SELF_SERVE_PORT
            value: "8081"

  - it: should wire the self-serve listener + token when a secret is named
    template: templates/deployment.yaml
    set:
      controller.update.selfServeSecretName: kc-self-serve
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: self-serve
            containerPort: 8081
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SELF_SERVE_TOKEN
            valueFrom:
              secretKeyRef:
                name: kc-self-serve
                key: self-serve-token
      # Migration default: pre-derivation workspaces holding the shared
      # master are still accepted (and logged) until the operator flips it.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SELF_SERVE_ALLOW_SHARED_TOKEN
            value: "true"

  - it: should enforce per-workspace tokens when allowSharedToken is false
    template: templates/deployment.yaml
    set:
      controller.update.selfServeSecretName: kc-self-serve
      controller.update.allowSharedToken: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SELF_SERVE_ALLOW_SHARED_TOKEN
            value: "false"

  # #421 — the controller no longer holds ANY of the values that shape the
  # privileged Job. The chart-ref / provisioner-image env moved to the broker's
  # Deployment (see the block after this one); what the controller keeps is the
  # address it files a ProvisionRequest at.
  - it: should not wire provisioning env when provisioning is off
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROVISION_BROKER_NAMESPACE
            value: kube-coder-provision

  - it: tells the controller only where to file a request, never how to build a Job
    template: templates/deployment.yaml
    set:
      provision.enabled: true
      provision.workspaceDomain: dev.example.com
      provision.gitops.repo: github.com/o/users.git
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROVISION_BROKER_NAMESPACE
            value: kube-coder-provision
      # Every one of these used to be injected here and threaded into the Job
      # manifest. A regression that reintroduces one is a regression that hands
      # an attacker back a value to choose.
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "CHART_REF")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "CHART_REPO")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "ALLOW_MUTABLE_CHART_REF")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "PROVISIONER_IMAGE")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "PROVISIONER_SERVICE_ACCOUNT")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "PROVISIONER_PULL_SECRET")]

  - it: should mount the controller code + SPA from ConfigMaps
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: controller-app
            configMap:
              name: workspace-controller-app
              defaultMode: 0444
      - contains:
          path: spec.template.spec.volumes
          content:
            name: controller-web
            configMap:
              name: workspace-controller-web
              defaultMode: 0444
