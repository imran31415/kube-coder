suite: controller metrics are isolated and opt-in
templates:
  - templates/podmonitor.yaml
  - templates/prometheus-rules.yaml
  - templates/networkpolicy.yaml
capabilities:
  apiVersions:
    - monitoring.coreos.com/v1/PodMonitor
    - monitoring.coreos.com/v1/PrometheusRule
tests:
  - it: emits no monitor by default
    template: templates/podmonitor.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: emits no alert rules by default
    template: templates/prometheus-rules.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: requires the metrics listener for a monitor
    template: templates/podmonitor.yaml
    set:
      controller.metrics.podMonitor.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: controller.metrics.enabled is required for the controller PodMonitor
  - it: scrapes only the dedicated metrics port
    template: templates/podmonitor.yaml
    set:
      controller.metrics.enabled: true
      controller.metrics.prometheusNamespace: monitoring
      controller.metrics.podMonitor.enabled: true
    asserts:
      - equal:
          path: spec.podMetricsEndpoints[0].port
          value: metrics
      - equal:
          path: spec.podMetricsEndpoints[0].path
          value: /metrics
  - it: limits monitoring access to its namespace and port
    template: templates/networkpolicy.yaml
    documentIndex: 0
    set:
      controller.metrics.enabled: true
      controller.metrics.prometheusNamespace: monitoring
    asserts:
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 9091
      - equal:
          path: spec.ingress[1].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: monitoring
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: prometheus
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8080
  - it: renders the complete optional rule group
    template: templates/prometheus-rules.yaml
    set:
      controller.metrics.prometheusRule.enabled: true
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 6
