suite: master metrics scrape token (#581)
templates:
  - templates/metrics-scrape-secret.yaml
values:
  - test-values.yaml
tests:
  # Off by default: a cluster whose Prometheus does not scrape workspace pods
  # has no use for the master, and an unused secret is one more thing to leak.
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: generates a master Secret when enabled
    set:
      controller.metricsScrapeToken.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: kc-metrics-scrape
      - exists:
          path: stringData["metrics-scrape-token"]

  - it: honours a pinned value
    set:
      controller.metricsScrapeToken.enabled: true
      controller.metricsScrapeToken.value: pinned-master
    asserts:
      - equal:
          path: stringData["metrics-scrape-token"]
          value: pinned-master

  # Bring-your-own (sealed-secrets / SOPS): the chart must not also mint one,
  # or two objects fight over the same name.
  - it: defers to an existing Secret
    set:
      controller.metricsScrapeToken.enabled: true
      controller.metricsScrapeToken.existingSecretName: my-scrape-master
    asserts:
      - hasDocuments:
          count: 0

  # The master is the one thing that must NEVER reach a tenant namespace: it
  # derives every workspace's token. It lives only where the controller does.
  - it: stays in the controller namespace
    set:
      controller.metricsScrapeToken.enabled: true
      namespace: coder
    asserts:
      - equal:
          path: metadata.namespace
          value: coder
