suite: provisioner RBAC (#103 per-workspace namespaces, broker-namespace move)
templates:
  - templates/provisioner-rbac.yaml
values:
  - test-values.yaml
tests:
  - it: renders nothing unless provisioning is enabled
    asserts:
      - hasDocuments:
          count: 0

  # With provisioning on, docs are: 0 ServiceAccount, 1 ClusterRole,
  # 2 ClusterRoleBinding — all cluster-scoped so the Job can create namespaces.
  - it: is a ClusterRole (not a namespaced Role) so it can create per-workspace namespaces
    set:
      provision.enabled: true
    documentIndex: 1
    asserts:
      - equal:
          path: kind
          value: ClusterRole
      - equal:
          path: metadata.name
          value: workspace-provisioner
      - notExists:
          path: metadata.namespace

  - it: grants namespace create/label for standing up tenants but NOT delete
    set:
      provision.enabled: true
    documentIndex: 1
    asserts:
      - equal:
          path: kind
          value: ClusterRole
      # Finding 4 tightening: normal provisioning only creates+labels the
      # namespace; teardown is a manual admin runbook, so no cluster-wide
      # namespace `delete` here.
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["namespaces"]
            verbs: ["get", "list", "watch", "create", "update", "patch"]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["namespaces"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["resourcequotas", "limitranges"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - it: can create the regcred image-pull Secret + RBAC in the new namespace
    set:
      provision.enabled: true
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["services", "persistentvolumeclaims", "configmaps", "secrets", "serviceaccounts"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - contains:
          path: rules
          content:
            apiGroups: ["rbac.authorization.k8s.io"]
            resources: ["roles", "rolebindings"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - it: places the privileged SA in the BROKER namespace, not the controller's
    set:
      provision.enabled: true
    documentIndex: 0
    asserts:
      - equal:
          path: kind
          value: ServiceAccount
      # #421 AC 1/2. The controller can create Jobs nowhere the provisioner SA
      # exists, because the SA no longer exists in a namespace the controller
      # has any workload verb in. test-values.yaml's namespace is `test`.
      - equal:
          path: metadata.namespace
          value: kube-coder-provision
      - notEqual:
          path: metadata.namespace
          value: test

  - it: binds the ClusterRole to the provisioner SA in the broker namespace
    set:
      provision.enabled: true
    documentIndex: 2
    asserts:
      - equal:
          path: kind
          value: ClusterRoleBinding
      - equal:
          path: roleRef.kind
          value: ClusterRole
      - equal:
          path: roleRef.name
          value: workspace-provisioner
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: workspace-provisioner
            namespace: kube-coder-provision
      # A binding still naming the control-plane namespace would either grant
      # nothing (the SA is not there) or, worse, re-grant it if someone
      # recreated the SA there. Assert the old subject is gone.
      - notContains:
          path: subjects
          content:
            kind: ServiceAccount
            name: workspace-provisioner
            namespace: test
