name: CI

# Run on every PR / push to main. The previous `paths: charts/**` filter
# skipped CI entirely on changes under charts/workspace/web/ (the SPA),
# letting frontend regressions ship green. The per-job step list is fast
# enough (~3 min total) that running unconditionally is the right default.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to a read-only token for every job. The security-scan job widens
# this to upload SARIF (see its own permissions block). Without an explicit
# block the workflow inherited the repo's read-only default, so the
# upload-sarif step failed on pushes to main with "Resource not accessible
# by integration" (PR runs happened to get a writable token and passed).
permissions:
  contents: read

jobs:
  helm-lint:
    name: Helm Lint & Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.21.3

      - name: Lint base-infrastructure chart
        run: helm lint charts/base-infrastructure/

      - name: Lint workspace chart
        run: helm lint charts/workspace/ -f charts/workspace/tests/test-values.yaml

      - name: Template workspace chart (basic auth)
        run: helm template test-ws charts/workspace/ -f charts/workspace/tests/test-values.yaml > /dev/null

      - name: Template workspace chart (oauth2 auth)
        run: |
          helm template test-ws charts/workspace/ \
            -f charts/workspace/tests/test-values.yaml \
            --set ingress.auth.type=oauth2 \
            --set oauth2.githubUsers=testuser \
            --set oauth2.cookieSecret=test-secret \
            --set oauth2.clientId=test-id \
            --set oauth2.clientSecret=test-secret \
            > /dev/null

      - name: Lint workspace-controller chart
        run: helm lint charts/workspace-controller/ -f charts/workspace-controller/tests/test-values.yaml

      - name: Template workspace-controller chart
        run: helm template test-wc charts/workspace-controller/ -f charts/workspace-controller/tests/test-values.yaml > /dev/null

  helm-test:
    name: Helm Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.21.3

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v0.5.2

      - name: Run unit tests (workspace)
        run: helm unittest charts/workspace/

      - name: Run unit tests (workspace-controller)
        run: helm unittest charts/workspace-controller/

  python-tests:
    name: Server.py Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Run server.py tests
        run: make python-tests

      - name: Run controller.py tests
        # controller.py has had its own stdlib-unittest suite for a long time but
        # nothing in CI ran it — including the supply-chain assertions on the
        # provisioner Job manifest (finding 7, #422). Both suites are pure
        # stdlib, no cluster, no network; this is seconds.
        run: make controller-python-tests

  shell-tests:
    name: Shell Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Syntax-check doctor.sh
        run: bash -n scripts/doctor.sh

      - name: Syntax-check memory-db-copy.sh
        # Behaviour is covered by tests.memory_db_path_test (it runs the script
        # against a throwaway DB); this just fails fast with a clear message.
        run: bash -n scripts/memory-db-copy.sh

      - name: doctor.sh operator-preflight tests (#580)
        # scripts/doctor.sh reaches the cluster only through read-only CLIs, so
        # the suite shims kubectl/helm/dig/git on PATH and drives each check's
        # inputs from env — fully offline, no cluster, no network, seconds.
        run: bash scripts/doctor_test.sh

  web-tests:
    name: Dashboard SPA Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: charts/workspace/web/yarn.lock

      - name: Install SPA deps
        run: yarn --cwd charts/workspace/web install --frozen-lockfile

      - name: Type-check + build
        run: yarn --cwd charts/workspace/web build

      - name: Vitest
        run: yarn --cwd charts/workspace/web test

  # The controller SPA has its own lockfile and vitest suite; without this job
  # its tests never ran in CI (the SCA gate above already covers both SPAs).
  controller-web-tests:
    name: Controller SPA Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: charts/workspace-controller/web/yarn.lock

      - name: Install SPA deps
        run: yarn --cwd charts/workspace-controller/web install --frozen-lockfile

      - name: Type-check + build
        run: yarn --cwd charts/workspace-controller/web build

      - name: Vitest
        run: yarn --cwd charts/workspace-controller/web test

  # The Expo / React Native app has its own npm lockfile and a vitest suite
  # (added in #417). Without this job neither its type-check nor its tests ran
  # in CI (the SCA gate above only audits its dependency tree). npm, not yarn.
  mobile-tests:
    name: Mobile App Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile deps
        run: npm ci
        working-directory: mobile

      - name: Type-check
        run: npm run typecheck
        working-directory: mobile

      - name: Vitest
        run: npm run test
        working-directory: mobile

  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: devlaptop/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: kube-coder:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build the runtime stage (no push). This still compiles the SPA
          # (runtime COPYs from the dashboard-builder stage, so a tsc/build
          # break fails here) and runs every install command — Ante, Claude
          # Code, OpenCode, ttyd — catching Dockerfile/dependency regressions
          # before deploy.
          target: runtime

      - name: Build provisioner image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: provisioner/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: kube-coder-provisioner:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Until #422 the provisioner image was built ONLY by the release
          # workflow, so a break in it surfaced at release time — on the one
          # image that runs under a cluster-privileged ServiceAccount. It now
          # also carries the Job's entrypoint script (provisioner/provision.sh),
          # which makes a silent break considerably worse: this builds it on
          # every PR, verifying the checksum-gated helm/kubectl fetches and the
          # COPY of the entrypoint. Small image, mostly cache hits.

      - name: Verify the provisioner entrypoint is baked in
        # The whole point of #422 item 1: the Job supplies no `command`, so the
        # image's ENTRYPOINT is the only thing that runs. Assert the built image
        # actually declares it and that the script is present + executable —
        # a Dockerfile edit that drops the COPY or the ENTRYPOINT would
        # otherwise produce an image whose Jobs exit 0 having done nothing.
        run: |
          set -euo pipefail
          entrypoint=$(docker inspect -f '{{ json .Config.Entrypoint }}' kube-coder-provisioner:ci-test)
          echo "provisioner ENTRYPOINT: ${entrypoint}"
          test "${entrypoint}" = '["/usr/local/bin/provision.sh"]'
          docker run --rm --entrypoint /bin/bash kube-coder-provisioner:ci-test \
            -c 'test -x /usr/local/bin/provision.sh && bash -n /usr/local/bin/provision.sh && test -s /etc/provisioner/helm-version'
          # Every tool the `make deploy` path shells out to must be baked in — the
          # Job runs in THIS image, not the controller image. A missing one (e.g.
          # python3, used by ensure-workspace-namespace.sh to reshape the regcred
          # Secret and derive the self-serve HMAC) otherwise only surfaces on a
          # live provisioning run as `<tool>: command not found`. Guard it here.
          docker run --rm --entrypoint /bin/bash kube-coder-provisioner:ci-test -c '
            set -euo pipefail
            for t in helm kubectl git make bash python3; do
              command -v "$t" >/dev/null || { echo "provisioner image missing required tool: $t" >&2; exit 1; }
            done
            # the exact stdlib modules the provisioner scripts import
            python3 -c "import json, hashlib, hmac, os, sys"
            echo "provisioner runtime tools OK: helm kubectl git make bash python3(+json/hashlib/hmac)"'

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: docker-build  # Wait for docker-build to complete
    permissions:
      contents: read          # checkout + trufflehog
      security-events: write  # upload-sarif -> GitHub code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@82df476e759c1448517fac6bfb3677685cdcd78a # main
        with:
          extra_args: --only-verified

      - name: Set up Docker
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker image for scanning
        id: scan-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: devlaptop/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: kube-coder-ci:latest
          # Reuse the layers docker-build (this job's `needs:`) just pushed to
          # the GHA cache — same default scope, so every layer is a hit and the
          # image is rebuilt in seconds instead of ~2min. It also stops this
          # step from re-fetching every third-party install URL on each run,
          # which is how a transient upstream outage (deb.nodesource.com 403,
          # 2026-07-27) could fail Security Scanning while the identical
          # docker-build job stayed green on cache. Read-only: docker-build
          # owns `cache-to`, so the two jobs can't race on writes.
          cache-from: type=gha
          target: runtime

      - name: Docker Image Vulnerability Scanning
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          image-ref: 'kube-coder-ci:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'
          # Drop findings with no upstream fix: kernel-header CVEs
          # (linux-libc-dev) don't apply to a container — it ships headers for
          # cgo, not a running kernel — and unfixed CVEs aren't actionable in
          # CI. Also auto-handles future no-fix kernel CVEs without churn.
          ignore-unfixed: true
          # .trivyignore lists code-server false positives (Trivy misreads the
          # bundled VS Code version as the code-server version). See the file.
          trivyignores: '.trivyignore'

      - name: Upload Trivy Scan Results
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        # Upload whenever the SARIF exists, even if an earlier step failed —
        # but skip (don't error) when it's absent, e.g. the image build or
        # Trivy itself failed and produced no report. `always()` alone made
        # the step fail with "Path does not exist: trivy-results.sarif",
        # masking the real upstream failure.
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate SBOM (Syft)
        # SPDX-JSON software bill of materials for the built image, uploaded as
        # a CI artifact. Runs regardless of the SCAN result so the SBOM is always
        # available for triage — but not when the image itself never got built:
        # Syft then can't resolve `kube-coder-ci:latest`, and its "could not
        # determine source" provider dump (docker/podman/containerd/registry/…)
        # buries the real failure a few steps up.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        if: (success() || failure()) && steps.scan-image.outcome == 'success'
        with:
          image: kube-coder-ci:latest
          format: spdx-json
          output-file: kube-coder-sbom.spdx.json
          artifact-name: kube-coder-sbom.spdx.json

      - name: Build provisioner image for SBOM
        id: scan-provisioner
        # #422 item 4: the CI SBOM covered only the workspace image, so the
        # toolchain on the *privileged* path — helm, kubectl, git, make — was
        # the one thing without a checked-in bill of materials. (Released
        # provisioner images always carried a BuildKit-native SBOM attestation
        # via release.yml; this closes the per-PR artifact gap.) Layers are hot
        # from docker-build's cache-to, so this is seconds.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        if: success() || failure()
        with:
          context: .
          file: provisioner/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: kube-coder-provisioner-ci:latest
          cache-from: type=gha

      - name: Generate SBOM (Syft) — provisioner
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        if: (success() || failure()) && steps.scan-provisioner.outcome == 'success'
        with:
          image: kube-coder-provisioner-ci:latest
          format: spdx-json
          output-file: kube-coder-provisioner-sbom.spdx.json
          artifact-name: kube-coder-provisioner-sbom.spdx.json

      - name: SCA Scanning (SPA dependencies)
        # yarn-classic advisories via audit-ci (blocking). Gates on high+
        # severity; the per-package audit-ci.jsonc allowlist covers dev/build-
        # time advisories that don't ship in the runtime image (tracked for
        # upgrade by Renovate). See docs/SUPPLY_CHAIN.md.
        if: success() || failure()
        run: |
          set -euo pipefail
          for dir in charts/workspace/web charts/workspace-controller/web; do
            echo "::group::audit-ci ${dir}"
            (cd "${dir}" && npx --yes audit-ci@^7 --config audit-ci.jsonc)
            echo "::endgroup::"
          done

      - name: SCA Scanning (Mobile dependencies)
        # Expo / React Native app npm lockfile via audit-ci (blocking). Same
        # high+ gate and per-package allowlist policy as the SPAs, but npm (not
        # yarn), so it gets its own step. `npm ci --ignore-scripts` gives audit
        # a resolved tree without running any dependency lifecycle scripts
        # during a security-only install. See mobile/audit-ci.jsonc.
        if: success() || failure()
        run: |
          set -euo pipefail
          echo "::group::audit-ci mobile"
          (cd mobile && npm ci --ignore-scripts && npx --yes audit-ci@^7 --config audit-ci.jsonc)
          echo "::endgroup::"

      - name: SCA Scanning (Python dependencies)
        # pip-audit (PyPA, OSV-backed, no account required) over the pinned
        # runtime deps (blocking). Replaces the former `safety check`, which
        # scanned only the runner's own install — the app is stdlib-only apart
        # from these. Allowlist unfixable advisories with `--ignore-vuln <ID>`.
        if: success() || failure()
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -r devlaptop/requirements.txt --desc
